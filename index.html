<!DOCTYPE html>
<html lang="pl">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1">

  <style>
    body {
      margin: 0;
      background: #101820;
      color: #f5f5f5;
      font-family: Arial, sans-serif;
    }
    main {
      max-width: 800px;
      margin: 0 auto;
      padding: 100px 24px;
    }
    h1 {
      font-size: clamp(40px, 8vw, 72px);
      margin-bottom: 24px;
    }
    p {
      font-size: 20px;
      line-height: 1.6;
      color: #c5cdd5;
    }
    .label {
      color: #73e2a7;
      font-size: 16px;
    }
  </style>
</head>
<body>
  <main>
    <p class="label">MOJA STRONA OSOBISTA</p>
    <h1>Wiktor Matuszak</h1>
    <p>Cześć! Właśnie buduję swoją stronę.
       Już niedługo znajdziesz tutaj więcej informacji o mnie
       i moich projektach.</p>
  </main>
</body>
</html>
